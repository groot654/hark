[project]
name = "hark"
version = "0.1.0"
description = "Local voice assistant for Windows: push-to-talk commands, dictation and an on-device AI model."
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.10,<6.11",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "numpy>=2.1",
    "sounddevice>=0.5",
    "onnxruntime>=1.20",
    "onnx-asr[hub]>=0.6",
    "keyboard>=0.13.5",
    "pywin32>=308; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pycaw>=20240316; sys_platform == 'win32'",
    "psutil>=6.1",
    "winrt-runtime>=3.2",
    "winrt-windows-media-control>=3.2",
    "winrt-windows-foundation>=3.2",
    "mcp>=2.3",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2"]

[project.scripts]
hark = "hark.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
